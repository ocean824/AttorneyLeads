<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Public Info Verification Report</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; color: #111827; }
      h1, h2 { margin-bottom: 0.5rem; }
      .muted { color: #6b7280; }
      .pill { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 999px; background: #e5f3ff; }
      pre { white-space: pre-wrap; background: #f8fafc; border: 1px solid #e5e7eb; padding: 1rem; border-radius: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Public Info Verification Report</h1>
    <p class="muted">Generated at {generated_at}</p>
    <p><strong>Subject:</strong> {subject}</p>
    <p><span class="pill">Overall score: {overall_score}</span></p>
    <h2>Summary</h2>
    <p>{summary}</p>
    <h2>Raw results</h2>
    <pre>{pretty_json}</pre>
  </body>
</html>
