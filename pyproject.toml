[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attorneyleads-public-info-verifier"
version = "0.1.1"
description = "Public information verification helpers for AttorneyLeads"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.14.2",
  "crawl4ai>=0.7.0",
  "lxml~=5.3",
  "playwright>=1.55.0",
  "requests>=2.32.5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["server", "server.*"]
exclude = ["server.test", "server.tests", "tests", "client", "shared", "config"]

[tool.setuptools.package-data]
"server.public_info_verifier" = ["templates/*.html"]
